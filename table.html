<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Table</title>
<style>

  body {
    background: #ff58d0;
    padding: 40px;
  }

  h1 {
    text-align: center;
    color: #ffffff;
  }

  .table-wrapper {
    overflow: auto;
    height: 320px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    color: #fff7fe;
  }

  th, td {
    text-align: left;
    padding: 14px 20px;
  }

  thead tr {
    position: sticky;
    top: 0; 
    background: #fe80d4;
  }
</style>
</head>
<body>

<h1>FIXED TABLE HEADER</h1>

<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th>CODE</th>
        <th>COMPANY</th>
        <th>PRICE</th>
        <th>CHANGE</th>
        <th>CHANGE %</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>AAC</td><td>AUSTRALIAN COMPANY</td><td>$1.38</td><td>+2.01</td><td>-0.36%</td>
      </tr>
      <tr>
        <td>AAD</td><td>AUSENCO</td><td>$2.38</td><td>-0.01</td><td>-1.36%</td>
      </tr>
      <tr>
        <td>AAX</td><td>ADELAIDE</td><td>$3.22</td><td>+0.01</td><td>+1.36%</td>
      </tr>
      <tr>
        <td>XXD</td><td>ADITYA BIRLA</td><td>$1.02</td><td>-1.01</td><td>+2.36%</td>
      </tr>
      <tr>
        <td>AAC</td><td>AUSTRAILIAN COMPANY</td><td>$1.38</td><td>+2.01</td><td>-0.36%</td>
      </tr>
      <tr>
        <td>AAD</td><td>AUSENCO</td><td>$2.36</td><td>-0.01</td><td>-1.36%</td>
      </tr>
    <tr>
        <td>AAX</td><td>ADELAIDE</td><td>$3.22</td><td>+0.01</td><td>+1.36%</td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
